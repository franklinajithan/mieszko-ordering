name: Verify ordering development
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: python -m pip install -r automation/requirements.txt
      - run: npx playwright install --with-deps chromium
      - run: python -m playwright install chromium
      - run: python -m unittest discover -s automation/tests -v
      - run: npm run test:system
# No deployment, office access, credentials, or database migration steps.
